<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo__mark">C</span>
      <span class="login-logo__name">Confera</span>
    </div>

    <h1 class="login-title">Bem-vindo de volta</h1>
    <p class="login-subtitle">Entre na sua conta para continuar</p>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label class="field__label" for="email">E-mail</label>
        <input
          id="email"
          class="field__input"
          type="email"
          placeholder="voce@empresa.com"
          formControlName="email"
          autocomplete="email"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field__error">E-mail inválido</span>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Senha</label>
        <input
          id="password"
          class="field__input"
          type="password"
          placeholder="••••••••"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field__error">Senha obrigatória</span>
        }
      </div>

      <button
        class="login-btn"
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="login-btn__spinner"></span>
          Entrando…
        } @else {
          Entrar
        }
      </button>
    </form>
  </div>
</div>

<app-toast />
