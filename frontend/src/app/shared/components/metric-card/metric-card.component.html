<div class="card">
  <div class="card__label">{{ label() }}</div>
  <div class="card__value">
    @if (prefix()) {
      <span class="card__prefix">{{ prefix() }}</span>
    }
    <span class="card__number">{{ formattedValue() }}</span>
  </div>
  @if (hasTrend()) {
    <div class="card__trend" [class.card__trend--up]="trendUp()" [class.card__trend--down]="!trendUp()">
      <span>{{ trendUp() ? '↑' : '↓' }}</span>
      {{ trendText() }}
    </div>
  }
</div>
