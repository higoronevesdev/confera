# App
spring.application.name=confera

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/devdb
spring.datasource.username=devuser
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MongoDB
spring.data.mongodb.uri=mongodb://devuser:devpass@localhost:27017/devdb

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=devpass

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=devuser
spring.rabbitmq.password=devpass

# Mail (Mailpit local)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT
confera.jwt.secret=confera-secret-key-dev-only-change-in-production-min-256-bits
confera.jwt.expiration=86400000
confera.jwt.refresh-expiration=604800000

# MinIO
confera.minio.url=http://localhost:9000
confera.minio.access-key=devuser
confera.minio.secret-key=devpass123
confera.minio.bucket=confera-files

# Logs
logging.level.dev.confera=DEBUG
logging.level.org.springframework.security=INFO
