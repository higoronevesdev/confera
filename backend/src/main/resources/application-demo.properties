# ============================================================
# Profile: demo
# Herdado de application.properties; apenas sobrescreve o necessário
# ============================================================

# Chave secreta para o endpoint POST /admin/demo/reset
# Troque este valor em qualquer ambiente não-local
confera.demo.reset-key=demo-reset-secret-change-in-production

# Logs mais detalhados do seeder
logging.level.dev.confera.shared.seed=INFO
logging.level.dev.confera.admin=INFO

# Hibernate batch para inserções do seeder (melhora performance)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true